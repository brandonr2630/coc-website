<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bible Reader – Todd's Road Church of Christ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --green: #7DC243;
      --green-dark: #5f9a2e;
      --charcoal: #3a3a3a;
      --charcoal-light: #666666;
      --cream: #F8F7F2;
      --white: #FFFFFF;
      --line: #e0ddd5;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      font-family: 'Nunito', sans-serif;
      background: var(--cream);
      color: var(--charcoal);
      overflow-x: hidden;
    }

    /* ── NAV (matches landing page) ── */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 48px;
      background: rgba(248,247,242,0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
    }
    .nav-logo { display: flex; align-items: center; gap: 12px; text-decoration: none; }
    .nav-logo img { height: 42px; width: 42px; border-radius: 50%; }
    .nav-name { font-family: 'Cormorant Garamond', serif; font-size: 1.1rem; font-weight: 600; color: var(--charcoal); letter-spacing: 0.02em; line-height: 1.2; }
    .nav-name span { display: block; font-size: 0.75rem; font-weight: 400; color: var(--charcoal-light); font-family: 'Nunito', sans-serif; letter-spacing: 0.08em; text-transform: uppercase; }
    .nav-links { display: flex; gap: 36px; align-items: center; }
    nav a.nav-link { font-size: 0.82rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--charcoal-light); text-decoration: none; transition: color 0.2s; }
    nav a.nav-link:hover, nav a.nav-link.active { color: var(--green); }
    .btn-primary { background: var(--green); color: #fff; padding: 14px 36px; border-radius: 3px; font-family: 'Nunito', sans-serif; font-size: 0.82rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; text-decoration: none; transition: background 0.25s; }
    .btn-primary:hover { background: var(--green-dark); }

    /* ── PAGE LAYOUT ── */
    .page-wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 104px 24px 60px;
      display: grid;
      grid-template-columns: 240px 1fr;
      gap: 28px;
      align-items: start;
    }

    /* ── PAGE HEADER ── */
    .page-header {
      grid-column: 1 / -1;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 4px;
    }
    .page-header .label {
      font-size: 0.72rem; font-weight: 700; letter-spacing: 0.25em;
      text-transform: uppercase; color: var(--green); margin-bottom: 8px;
    }
    .page-header h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.8rem, 4vw, 2.8rem);
      font-weight: 300; line-height: 1.1; color: var(--charcoal);
    }
    .page-header h1 em { font-style: italic; color: var(--green); }
    .page-header .translation-tag {
      display: inline-block; margin-top: 10px;
      font-size: 0.7rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--green-dark); background: rgba(125,194,67,0.12);
      border: 1px solid rgba(125,194,67,0.3); padding: 3px 10px; border-radius: 3px;
    }

    /* ── SIDEBAR ── */
    .sidebar {
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 4px;
      overflow: hidden;
      position: sticky;
      top: 88px;
      max-height: calc(100vh - 108px);
      overflow-y: auto;
    }
    .sidebar::-webkit-scrollbar { width: 4px; }
    .sidebar::-webkit-scrollbar-thumb { background: var(--line); border-radius: 2px; }
    .sidebar-header {
      background: var(--charcoal); color: var(--cream);
      padding: 10px 14px;
      font-size: 0.68rem; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase;
    }
    .testament-label {
      padding: 8px 14px 4px;
      font-size: 0.62rem; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase;
      color: var(--green-dark); background: rgba(125,194,67,0.08);
    }
    .book-grid { display: grid; grid-template-columns: 1fr 1fr; }
    .book-btn {
      background: var(--white); border: none; border-bottom: 1px solid var(--line); border-right: 1px solid var(--line);
      padding: 7px 10px; font-size: 0.7rem; font-family: 'Nunito', sans-serif;
      color: var(--charcoal-light); cursor: pointer; text-align: left;
      transition: background 0.15s, color 0.15s;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .book-btn:hover { background: rgba(125,194,67,0.08); color: var(--charcoal); }
    .book-btn.active { background: var(--green); color: white; font-weight: 700; }

    /* ── MAIN READER ── */
    .reader { display: flex; flex-direction: column; gap: 20px; }

    /* Chapter selector */
    .chapter-bar {
      background: var(--white); border: 1px solid var(--line); border-radius: 4px; padding: 16px 20px;
    }
    .chapter-bar-top {
      display: flex; align-items: baseline; gap: 12px; margin-bottom: 14px;
    }
    .chapter-bar-top .book-name {
      font-family: 'Cormorant Garamond', serif; font-size: 1.4rem; font-weight: 600; color: var(--charcoal);
    }
    .divider-line { width: 36px; height: 2px; background: var(--green); margin-bottom: 12px; }
    .chapter-grid { display: flex; flex-wrap: wrap; gap: 5px; }
    .ch-btn {
      width: 32px; height: 32px; border-radius: 3px; border: 1.5px solid var(--line);
      background: var(--white); font-family: 'Nunito', sans-serif; font-size: 0.75rem; font-weight: 600;
      color: var(--charcoal-light); cursor: pointer; transition: all 0.15s;
      display: flex; align-items: center; justify-content: center;
    }
    .ch-btn:hover { border-color: var(--green); color: var(--green-dark); background: rgba(125,194,67,0.08); }
    .ch-btn.active { background: var(--green); border-color: var(--green); color: white; }

    /* Passage */
    .passage-card {
      background: var(--white); border: 1px solid var(--line); border-radius: 4px;
      padding: 40px 44px; min-height: 300px;
    }
    .passage-heading {
      display: flex; align-items: baseline; gap: 14px; margin-bottom: 24px;
      padding-bottom: 16px; border-bottom: 2px solid rgba(125,194,67,0.2);
    }
    .passage-heading .ref {
      font-family: 'Cormorant Garamond', serif; font-size: 1.8rem; font-weight: 600; color: var(--charcoal);
    }

    .verses { }
    .verse {
      font-family: 'Cormorant Garamond', serif; font-size: 1.15rem; font-weight: 400;
      color: var(--charcoal); line-height: 2;
    }
    .verse-num {
      font-family: 'Nunito', sans-serif; font-size: 0.6rem; font-weight: 700;
      color: var(--green); vertical-align: super; margin-right: 2px; user-select: none;
    }

    /* Nav arrows */
    .passage-footer {
      display: flex; justify-content: space-between; align-items: center;
      margin-top: 32px; padding-top: 20px; border-top: 1px solid var(--line);
    }
    .nav-arrow {
      display: flex; align-items: center; gap: 8px;
      background: none; border: 1.5px solid var(--line); border-radius: 3px;
      padding: 9px 18px; font-family: 'Nunito', sans-serif; font-size: 0.78rem;
      font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--charcoal-light); cursor: pointer; transition: all 0.2s;
    }
    .nav-arrow:hover:not(:disabled) { border-color: var(--green); color: var(--green-dark); background: rgba(125,194,67,0.08); }
    .nav-arrow:disabled { opacity: 0.3; cursor: not-allowed; }

    /* Loading */
    .state-msg {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 60px 20px; color: var(--charcoal-light); gap: 14px;
    }
    .spinner {
      width: 34px; height: 34px; border: 3px solid rgba(125,194,67,0.2);
      border-top-color: var(--green); border-radius: 50%; animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .state-msg p { font-family: 'Cormorant Garamond', serif; font-size: 1.1rem; font-style: italic; }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      nav { padding: 16px 20px; }
      .nav-links { display: none; }
      .page-wrap { grid-template-columns: 1fr; padding-top: 80px; }
      .page-header { grid-column: 1; }
      .sidebar { position: static; max-height: 260px; }
      .passage-card { padding: 24px 20px; }
    }
  </style>
</head>

  document.getElementById('nav-logo-img').src = LOGO_B64;
});

// ── Build sidebar ──
function renderSidebar() {
  ['ot','nt'].forEach(t => {
    const el = document.getElementById(`${t}-list`);
    el.innerHTML = '';
    BOOKS.filter(b => b.testament === t).forEach(book => {
      const btn = document.createElement('button');
      btn.className = 'book-btn' + (book.name === currentBook.name ? ' active' : '');
      btn.textContent = book.name;
      btn.title = book.name;
      btn.onclick = () => { currentBook = book; currentChapter = 1; renderAll(); };
      el.appendChild(btn);
    });
  });
}

// ── Build chapter grid ──
function renderChapterGrid() {
  document.getElementById('current-book-label').textContent = currentBook.name;
  const grid = document.getElementById('chapter-grid');
  grid.innerHTML = '';
  for (let i = 1; i <= currentBook.chapters; i++) {
    const btn = document.createElement('button');
    btn.className = 'ch-btn' + (i === currentChapter ? ' active' : '');
    btn.textContent = i;
    btn.onclick = () => { currentChapter = i; renderAll(); };
    grid.appendChild(btn);
  }
}

// ── Fetch passage ──
async function renderPassage() {
  const card = document.getElementById('passage-card');
  card.innerHTML = `<div class="state-msg"><div class="spinner"></div><p>Loading scripture…</p></div>`;
  const url = `https://bible-api.com/${encodeURIComponent(currentBook.name + ' ' + currentChapter)}?translation=web`;
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error();
    const data = await res.json();
    if (!data.verses || !data.verses.length) throw new Error('no verses');

    const prevDisabled = currentBook === BOOKS[0] && currentChapter === 1;
    const nextDisabled = currentBook === BOOKS[BOOKS.length-1] && currentChapter === currentBook.chapters;

    const versesHtml = data.verses.map(v =>
      `<span class="verse"><sup class="verse-num">${v.verse}</sup>${v.text.trim()} </span>`
    ).join('');

    card.innerHTML = `
      <div class="passage-heading">
        <span class="ref">${currentBook.name} ${currentChapter}</span>
        <span class="translation-tag">World English Bible</span>
      </div>
      <div class="verses">${versesHtml}</div>
      <div class="passage-footer">
        <button class="nav-arrow" id="btn-prev" ${prevDisabled ? 'disabled' : ''}>
          ← Previous
        </button>
        <button class="nav-arrow" id="btn-next" ${nextDisabled ? 'disabled' : ''}>
          Next →
        </button>
      </div>`;

    document.getElementById('btn-prev').onclick = () => {
      if (currentChapter > 1) currentChapter--;
      else { const i = BOOKS.indexOf(currentBook); if (i > 0) { currentBook = BOOKS[i-1]; currentChapter = currentBook.chapters; } }
      renderAll();
    };
    document.getElementById('btn-next').onclick = () => {
      if (currentChapter < currentBook.chapters) currentChapter++;
      else { const i = BOOKS.indexOf(currentBook); if (i < BOOKS.length-1) { currentBook = BOOKS[i+1]; currentChapter = 1; } }
      renderAll();
    };
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } catch {
    card.innerHTML = `<div class="state-msg"><p>Could not load passage. Please check your connection and try again.</p></div>`;
  }
}

function renderAll() {
  renderSidebar();
  renderChapterGrid();
  renderPassage();
}

renderAll();
</script>
